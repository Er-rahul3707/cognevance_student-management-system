# Opt-in, persistent local-only database. Never used by the default MySQL profile.
spring.datasource.url=jdbc:h2:file:./data/student-management;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
app.auth.username=${APP_AUTH_USERNAME:}
app.auth.password=${APP_AUTH_PASSWORD:}
