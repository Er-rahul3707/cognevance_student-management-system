spring.application.name=student-management-system
server.port=${SERVER_PORT:${PORT:8080}}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/student_management?serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:student_app}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
spring.jackson.serialization.write-dates-as-timestamps=false
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}
app.auth.username=${APP_AUTH_USERNAME:}
app.auth.password=${APP_AUTH_PASSWORD:}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
