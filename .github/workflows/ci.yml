name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run backend tests and package verification
        run: mvn -f backend/pom.xml verify
      - name: Check frontend JavaScript
        run: |
          node --check frontend/js/app.js
          node --check frontend/js/student-utils.mjs
          node --test frontend/js/student-utils.test.mjs
